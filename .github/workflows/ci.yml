name: CI - Build, Scan & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # SonarCloud Scan (Quality + Code Smells + Bugs)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=mani0013
            -Dsonar.projectKey=Mani0013_devsecops-food-delivery
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,dist/**,coverage/**
      # OWASP Dependency-Check (Vulnerability scan on deps)
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'freshbite'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --enableExperimental
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

      # Trivy Filesystem Scan (Vulnerabilities in code/files)
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'

      # Build Docker Image (multi-stage)
      - name: Build Docker Image
        run: docker build -t manideep003/freshbite:${{ github.sha }} .

      # Trivy Image Scan (Vulnerabilities in Docker image)
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'manideep003/freshbite:${{ github.sha }}'
          format: 'table'
          output: 'trivy-image-report.txt'
          severity: 'CRITICAL,HIGH'

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Scout
      - name: Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: manideep003/freshbite:${{ github.sha }}
          summary: true
          only-severities: critical,high
          exit-code: false 
          github-token: ${{ secrets.GITHUB_TOKEN }} 

      # Push Docker Image (latest + SHA for immutability)
      - name: Push Docker Image
        run: |
          docker tag manideep003/freshbite:${{ github.sha }} manideep003/freshbite:latest
          docker push manideep003/freshbite:${{ github.sha }}
          docker push manideep003/freshbite:latest