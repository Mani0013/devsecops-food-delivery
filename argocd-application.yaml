apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freshbite-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mani0013/devsecops-food-delivery.git
    targetRevision: main
    path: kubernetes  
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # Deploys to default namespace in EKS
  syncPolicy:
    automated:
      prune: true       
      selfHeal: true    
    syncOptions:
      - CreateNamespace=tru